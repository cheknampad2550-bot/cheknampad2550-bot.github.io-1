
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile 🌸 สุภัสสรา เจ๊กนาม</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Mali', cursive;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffb6c1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        .profile-card {
            background-color: #ffffff;
            width: 450px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            border: 4px dashed #ff99cc;
            z-index: 10;
        }
        .profile-pic {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff66a3;
            box-shadow: 0 5px 15px rgba(255, 102, 163, 0.4);
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        h1 {
            margin: 10px 0 5px 0;
            color: #d81b60;
            font-size: 26px;
            font-weight: 700;
        }
        .university {
            color: #8e24aa;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .info-container {
            background-color: #fff0f5;
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            border: 2px solid #ffcce0;
        }
        .info-item {
            padding: 10px 0;
            border-bottom: 2px dotted #ffb3d9;
            font-size: 16px;
            color: #444;
            display: flex;
            align-items: center;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 700;
            color: #c2185b;
            width: 140px;
            flex-shrink: 0;
        }
        .deco-melody {
            position: absolute;
            top: -30px;
            left: -30px;
            width: 100px;
            transform: rotate(-15deg);
        }
        .deco-kuromi {
            position: absolute;
            bottom: -20px;
            right: -25px;
            width: 100px;
            transform: rotate(10deg);
        }
        .sparkles {
            color: #ff4d94;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img src="mymelody.png" alt="My Melody" class="deco-melody" onerror="this.style.display='none'"> 
        
        <img src="1550825B-99CE-43F6-8732-168974BFB977 (1)_5.jpg" alt="รูปโปรไฟล์ สุภัสสรา" class="profile-pic">
        
        <img src="kuromi.png" alt="Kuromi" class="deco-kuromi" onerror="this.style.display='none'">

        <h1><span class="sparkles">🎀</span> นางสาว สุภัสสรา เจ๊กนาม <span class="sparkles">🖤</span></h1>
        <div class="university">มหาวิทยาลัยราชภัฏหมู่บ้านจอมบึง</div>
        
        <div class="info-container">
            <div class="info-item">
                <span class="info-label">🐰 รหัสนักศึกษา:</span>
                <span>694245018</span>
            </div>
            <div class="info-item">
                <span class="info-label">💻 สาขา:</span>
                <span>วิทยาการคอมพิวเตอร์</span>
            </div>
            <div class="info-item">
                <span class="info-label">🌸 คณะ:</span>
                <span>วิทยาศาสตร์และเทคโนโลยี</span>
            </div>
            <div class="info-item">
                <span class="info-label">📱 เบอร์โทรศัพท์:</span>
                <span>0924972320</span>
            </div>
            <div class="info-item">
                <span class="info-label">💌 อีเมล:</span>
                <span>cheknampad2550@gmail.com</span>
            </div>
        </div>
    </div>
</body>
</html>
